# Compila automáticamente el .exe de Windows (y binarios de Linux/macOS) al subir el código a GitHub.
# Descarga el resultado en la pestaña "Actions" -> artefactos.
name: Compilar America1490
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pygame pyinstaller
      - run: python -m PyInstaller --noconfirm --clean americas1490.spec
      - uses: actions/upload-artifact@v4
        with:
          name: America1490-${{ matrix.os }}
          path: dist/*

